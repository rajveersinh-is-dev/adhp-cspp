name: Continuous Integration

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check code formatting
        run: cargo fmt --check

      - name: Run Clippy linter
        run: cargo clippy --all-targets -- -D warnings

      - name: Run unit & differential tests
        run: cargo test --verbose

      - name: Run differential baseline verification (100 instances)
        run: cargo run --bin verify_oracle --release

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python verification dependencies
        run: pip install numpy scipy pandas

      - name: Run independent HiGHS ILP oracle verification
        run: python scripts/verify_against_ilp.py

      - name: Run benchmark dataset and summary verifier
        run: python scripts/verify_benchmarks.py

      - name: Run all Python verification test suites
        run: python -m unittest discover -s tests -p "test_*.py"

